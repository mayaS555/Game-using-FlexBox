<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>מיון כוכבי הלכת - משחק ללימוד Flexbox</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <div class="page">

    <header class="app-header">
      <h1>🚀 מיון כוכבי הלכת</h1>
      <p class="subtitle">משחק ללימוד Flexbox &mdash; סדרו את כוכבי הלכת בסיפון המטען לפי ההוראה</p>
    </header>

    <div class="progress-row">
      <p id="level-progress" class="level-progress">שלב 1 מתוך 8</p>
      <p id="score-display" class="score-display">ניקוד: 0</p>
      <div id="level-dots" class="level-dots"></div>
      <div class="level-nav">
        <button id="btn-prev" class="btn btn-nav">◀ שלב קודם</button>
        <button id="btn-next" class="btn btn-nav">שלב הבא ▶</button>
      </div>
    </div>

    <main class="game-area">

      <section class="instruction-panel">
        <h2>המשימה:</h2>
        <p id="instruction">טוען...</p>
        <p id="attempts" class="attempts">נסיונות בשלב זה: 0</p>
      </section>

      <div class="board-wrapper" dir="ltr">
        <div id="board" class="board"></div>
      </div>

      <section class="controls-panel">
        <div class="control-group">
          <label for="ctrl-direction">כיוון הפריסה</label>
          <select id="ctrl-direction">
            <option value="row">שורה</option>
            <option value="column">עמודה</option>
          </select>
        </div>

        <div class="control-group">
          <label for="ctrl-justify">יישור על הציר הראשי</label>
          <select id="ctrl-justify">
            <option value="flex-start">התחלה</option>
            <option value="center">מרכז</option>
            <option value="flex-end">סוף</option>
            <option value="space-between">רווח בין</option>
            <option value="space-around">רווח מסביב</option>
            <option value="space-evenly">רווח שווה</option>
          </select>
        </div>

        <div class="control-group">
          <label for="ctrl-align">יישור על הציר המשני</label>
          <select id="ctrl-align">
            <option value="flex-start">התחלה</option>
            <option value="center">מרכז</option>
            <option value="flex-end">סוף</option>
          </select>
        </div>

        <div class="control-group">
          <label for="ctrl-wrap">גלישה</label>
          <select id="ctrl-wrap">
            <option value="nowrap">בלי גלישה</option>
            <option value="wrap">עם גלישה</option>
          </select>
        </div>
      </section>

      <div class="actions-row">
        <button id="btn-check" class="btn btn-primary">בדוק פתרון</button>
        <button id="btn-reset" class="btn btn-secondary">איפוס שלב</button>
      </div>

      <p id="feedback" class="feedback" aria-live="polite"></p>

    </main>

  </div>

  <script src="script.js"></script>
</body>
</html>
